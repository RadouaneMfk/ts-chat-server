
services:
    postgres:
        image: postgres:17
        container_name: postgres-chatapp
        environment:
            - POSTGRES_USER=chatuser
            - POSTGRES_PASSWORD=chatpass
            - POSTGRES_DB=chatdb
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data: