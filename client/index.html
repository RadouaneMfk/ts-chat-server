<!DOCTYPE html>
<html>
<head>
    <title>Chat Test</title>
</head>
<body>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        // paste your token from POST /auth/login
        const token = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6MSwidXNlcm5hbWUiOiJyZWQxR29hdCIsImlhdCI6MTc3NTU1NzcxMSwiZXhwIjoxNzc2MTYyNTExfQ.Pnm40M5oJK21g79hbsMwbhNJs1uGdsSi-XI3jMANewc'

        const socket = io('http://localhost:3000', {
            auth: { token }
        })

        socket.on('connect', () => {
            console.log('✅ Connected:', socket.id)

            // join room 1
            socket.emit('joinRoom', '1')
        })

        // receive message history when joining
        socket.on('messagesHistory', (messages) => {
            console.log('📜 Message history:', messages)
        })

        // receive new messages
        socket.on('message', (payload) => {
            console.log('💬 New message:', payload)
        })

        // someone joined the room
        socket.on('userJoined', (user) => {
            console.log('👤 User joined:', user)
        })

        // send a message after 2 seconds
        setTimeout(() => {
            socket.emit('sendMessage', 'Hello from client!', '1')
            console.log('📤 Message sent')
        }, 2000)

        socket.on('connect_error', (err) => {
            console.log('❌ Error:', err.message)
        })
    </script>
</body>
</html>
