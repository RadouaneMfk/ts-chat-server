<!DOCTYPE html>
<html>
<head>
    <title>Chat Test</title>
</head>
<body>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        // paste your token from POST /auth/login
        const token = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6MiwidXNlcm5hbWUiOiJzYmVlZTMiLCJpYXQiOjE3NzYxNjI1MzQsImV4cCI6MTc3Njc2NzMzNH0.L84QfkTy2k6ORUr6AQUgiGJNsbpa2B19xzSLsFF18vw'

        const socket = io('http://localhost:3000', {
            auth: { token }
        })

        socket.on('connect', () => {
            console.log('✅ Connected:', socket.id)

            // join room 1
            socket.emit('joinRoom', '1')
        })

        socket.on('messagesHistory', (messages) => {
            console.log('📜 Message history:', messages)
        })

        socket.on('message', (payload) => {
            console.log('💬 New message:', payload)
        })

        socket.on('userJoined', (user) => {
            console.log('👤 User joined:', user)
        })

        socket.on('userLeft', (user) => {
            console.log('👋 User left:', user)
        })

        socket.on('roomUsers', (users) => {
            console.log('👥 Online users:', users)
        })

        // send a message after 2 seconds
        setTimeout(() => {
            socket.emit('sendMessage', 'Hello from client2!', '1')
            console.log('📤 Message sent')
        }, 2000)

        socket.on('connect_error', (err) => {
            console.log('❌ Error:', err.message)
        })
    </script>
</body>
</html>
